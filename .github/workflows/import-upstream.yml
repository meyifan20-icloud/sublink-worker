name: Import Sublink Worker Upstream

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-upstream.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout personal repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone upstream snapshot
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/7Sageer/sublink-worker.git /tmp/sublink-upstream

      - name: Import upstream files
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          find .github -mindepth 1 -maxdepth 1 ! -name workflows -exec rm -rf {} + 2>/dev/null || true
          find .github/workflows -mindepth 1 -maxdepth 1 ! -name import-upstream.yml -exec rm -rf {} + 2>/dev/null || true
          rsync -a --delete             --exclude='.git/'             --exclude='.github/workflows/import-upstream.yml'             /tmp/sublink-upstream/ ./
          # Ensure the one-time importer stays available until verification finishes.
          mkdir -p .github/workflows
          cp "$GITHUB_WORKSPACE/.github/workflows/import-upstream.yml" /tmp/import-upstream.yml 2>/dev/null || true
          if [ -f /tmp/import-upstream.yml ]; then
            cp /tmp/import-upstream.yml .github/workflows/import-upstream.yml
          fi

      - name: Commit imported snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to import."
          else
            git commit -m "chore: import upstream sublink-worker snapshot"
            git push origin main
          fi
